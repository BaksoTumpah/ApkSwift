name: Deploy to Firebase Hosting on merge
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
concurrency:
  group: deploy-live
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build situs dari data Firestore
        run: node scripts/build.mjs
      - name: Cek apakah isi situs berubah
        id: diff
        run: |
          new=$(cat public/build-hash.txt)
          old=$(curl -fsS --max-time 20 https://apkswift.web.app/build-hash.txt || echo none)
          echo "baru=$new lama=$old"
          if [ "$new" = "$old" ] && [ "${{ github.event_name }}" = "schedule" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: steps.diff.outputs.changed == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APKSWIFT_4EA9E }}
          channelId: live
          projectId: apkswift-4ea9e
